plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.bcs.RecoX'
    compileSdk 34

    defaultConfig {
        applicationId "com.bcs.RecoX"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}


android {
    // existing config...
    signingConfigs {
        release {
            // Replace with your keystore details or set via gradle.properties
            storeFile file(System.getenv("RECOX_KEYSTORE_PATH") ?: "keystore/recox.keystore")
            storePassword System.getenv("RECOX_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RECOX_KEY_ALIAS")
            keyPassword System.getenv("RECOX_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha03'
    implementation 'androidx.work:work-runtime-ktx:2.8.1'
    implementation 'com.airbnb.android:lottie:6.1.0'
}
